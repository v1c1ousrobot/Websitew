<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- Theme switcher (top left) -->
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
    <span class="icon sun">☀</span>
    <span class="icon moon">☾</span>
  </button>

  <main class="wrapper">

    <!-- Profile -->
    <section class="profile">
      <img class="avatar" src="https://github.com/v1c1ousrobot.png" alt="Posh avatar">
      <h1 class="name">Posh</h1>
      <p class="handle">@poshplasma</p>
    </section>

    <!-- Bio card -->
    <section class="bio">
      <p>I make some cool stuff like games and launchers. I love Anime, Manga, Friends, Family and Hanging out!</p>
    </section>

    <!-- Buttons -->
    <section class="buttons">
      <a href="https://github.com/v1c1ousrobot/LauncherDownload/releases/tag/v1.0.0" class="btn primary" target="_blank" rel="noopener">
        Posh Launcher
      </a>
      <a href="https://discord.gg/t78GMgmxJA" class="btn discord" target="_blank" rel="noopener">
         Community
      </a>
      <a href="https://github.com/v1c1ousrobot" class="btn ghost" target="_blank" rel="noopener">
        ★ GitHub Profile
      </a>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
