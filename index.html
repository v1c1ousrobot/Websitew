<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-tint"></div>

  <div class="bubbles" id="bubbles">
    <span data-bubble></span><span data-bubble></span><span data-bubble></span>
    <span data-bubble></span><span data-bubble></span><span data-bubble></span>
    <span data-bubble></span><span data-bubble></span><span data-bubble></span>
    <span data-bubble></span><span data-bubble></span><span data-bubble></span>
  </div>

  <div class="streaks"><div></div><div></div><div></div></div>

  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- Theme toggle (top left) -->
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
    <span class="icon sun">☀</span>
    <span class="icon moon">☾</span>
  </button>

  <!-- Sound menu (top right) -->
  <div class="sound-menu">
    <button id="soundBtn" class="theme-toggle sound-toggle" aria-label="Sound">
      <span class="icon music-on">🔊</span>
      <span class="icon music-off">🔇</span>
    </button>
    <div class="sound-dropdown" id="soundDropdown">
      <button data-volume="0">🔇 Silent</button>
      <button data-volume="0.5" class="active">🔉 Medium</button>
      <button data-volume="1">🔊 Max</button>
    </div>
  </div>

  <main class="wrapper">

    <section class="profile glass tilt">
      <div class="avatar-wrap">
        <img class="avatar" src="https://github.com/v1c1ousrobot.png" alt="Posh avatar">
        <div class="avatar-shine"></div>
        <div class="avatar-ring-glow"></div>
      </div>
      <h1 class="name">Posh</h1>
      <p class="handle">@v1c1ousrobot</p>
    </section>

    <section class="bio glass tilt">
      <p>I make some cool stuff like games and launchers.<br>
      I love Anime, Manga, Friends, Family and Hanging out!</p>
    </section>

    <section class="buttons">
      <a href="https://github.com/v1c1ousrobot/LauncherDownload/releases/tag/v1.0.0"
         class="btn primary" target="_blank" rel="noopener">
        <span class="btn-shine"></span>
        <span class="label">⚡ Posh Launcher</span>
      </a>
      <a href="https://discord.gg/t78GMgmxJA"
         class="btn discord" target="_blank" rel="noopener">
        <span class="btn-shine"></span>
        <span class="label">💬 Community</span>
      </a>
      <a href="https://github.com/v1c1ousrobot"
         class="btn ghost" target="_blank" rel="noopener">
        <span class="btn-shine"></span>
        <span class="label">★ GitHub Profile</span>
      </a>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
